# The DedupCommando site moved to https://dedcom.dequzzy.io/ (source: dedupcommando/site).
# This repo keeps the old address https://dedupcommando.github.io/ working: every page here only
# forwards to the new one. The APT repository under /apt/ is the separate repo dedupcommando/apt.
name: Deploy redirects (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/upload-pages-artifact@v5
        with:
          path: redirect

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
